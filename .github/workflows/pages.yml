name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sample decks
        run: |
          python3 tools/check-deck.py sample_projects/basic/index.html
          python3 tools/check-deck.py sample_projects/advance/index.html
          node --test tests/media.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html LICENSE _site/
          cp -R site stage-js theme sample_projects _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
